name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'display.html'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'display.html'
  workflow_call:
    inputs:
      version:
        description: 'Release version (e.g. "1.2.3" without the leading v); defaults to the git tag or a snapshot'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: chmod +x gradlew && ./gradlew build ${{ inputs.version != '' && format('-Pversion={0}', inputs.version) || '' }}

      - name: Upload mixer jar
        uses: actions/upload-artifact@v4
        with:
          # NOTE: GitHub always serves artifacts as a .zip archive
          # (this downloads as mixer.zip containing the jar).
          # For a direct .jar download, publish a Release instead —
          # release.yml attaches the jar as a raw release asset.
          name: mixer
          path: build/libs/*.jar
