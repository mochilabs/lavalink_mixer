openapi: 3.1.0
info:
  title: mixer-plugin REST API
  version: 1.2.0
  description: |
    Control plane for the Lavalink mixer-plugin (gapless queue, overlap
    crossfade, TTS/announcement overlay with ducking, silence skipping,
    volume normalization, BPM analysis, and beat-matched AutoMix).
    The info.version above identifies this API document; it is not the JAR version.

    PROTOCOL V2 — JIT PREFETCH & EPOCH FENCING.
    AGENT WORKFLOW (follow this order per guild):
    1. Enable audio output per player via Lavalink v4's Update Player endpoint:
       PATCH /v4/sessions/{sessionId}/players/{guildId} with
       `{ "filters": { "pluginFilters": { "mixer": { "guildId": "<id>" } } } }`.
       Keep the mixer entry and any other desired filters on later updates,
       because updating filters replaces the player's filter configuration.
       Without this filter, mixer effects are not applied; ordinary main audio can still play.
    2. Optionally tune per-guild behavior: POST /mixer/crossfade,
       POST /mixer/fade-in, POST /mixer/normalization, POST /mixer/silence,
       POST /mixer/bpm and POST /mixer/beatmatch.
       Beat-matched AutoMix requires crossfadeEnabled, bpmDetectionEnabled,
       and beatmatchEnabled. BPM detection and beat matching default to off.
       POST /mixer/bpm can enable detection and beat matching together.
       POST /mixer/beatmatch does not enable BPM detection.
    3. Track transitions are driven by the server: the plugin fires
       `MixerNeedNextTrackEvent` when crossfadeMs + 7s remain, or earlier when
       BPM detection and beat matching are enabled (crossfadeMs plus up to
       120s based on the configured BPM scan window). The client
       MUST respond by POSTing to `queue/arm` with the next track and the
       expected monotonic epoch. If the user changes the queue, the client
       sends `queue/invalidate`. On explicit user stops/skips, the client
       sends `queue/override`. No client `play()` calls are needed for
       server-driven transitions. The client starts initial playback and keeps
       its queue synchronized with `MixerAdvancedEvent`. Disable client auto-skip
       to avoid racing the server. Bot integrations must implement this event
       and REST flow directly; see the protocol-v2 integration guide.
    4. Inspect with GET /mixer/state.

    All guildIds are strings (snowflakes exceed 2^53, JSON numbers would lose precision).
    All durations are milliseconds. Configuration endpoints return the updated
    MixerState. Omitted optional configuration values preserve the current setting;
    supplied numeric values are clamped as documented, not rejected for range alone.

    Only arm, invalidate, override, and reset require Idempotency-Key. Keys are
    arbitrary strings, scoped per guild; UUIDs are a client convention, not a
    validated format. The server retains 64 recent fingerprints in memory.
    A retained matching key returns a duplicate response before epoch/window checks.
    A mismatched fingerprint returns HTTP 422. Fingerprints are operation-specific,
    not full JSON hashes: arm uses the encoded track or empty marker plus
    preserve/start/end options, invalidate
    uses the operation name, override uses action plus encoded track, and reset
    uses the supplied epoch. For arm, invalidate, and override, new keys with
    equal epochs are accepted; lower epochs return HTTP 409. Use a new key for each new logical command.
    Reset clears prior keys and retains its own key. This is not durable
    exactly-once delivery across eviction, reset, or process restart.

    Beat-match phase is a track-relative beat-grid coordinate, not a musical
    downbeat. An ARMED or ready track may still lack BPM analysis. Missing or
    unsuitable grids fall back without waiting for analysis to finish.

    WEBSOCKET EVENTS (push, custom `op: "mixer"`):
    The plugin pushes `{ "op": "mixer", ... }` frames to the Lavalink WebSocket
    session owning the guild's player. Consume them on the client's raw-message hook
    through a handler that supports protocol v2.
    - `{"op":"mixer","type":"MixerNeedNextTrackEvent","guildId":"<id>",
       "remainingMs":<ms>,"currentTrackEncoded":"<base64>"}`
      - JIT event fired at T_window before track end: crossfadeMs + 7000ms,
        or crossfadeMs + min(2 * bpmScanMs + 7000ms, 120000ms) with BPM
        detection and beat matching enabled.
    - `{"op":"mixer","type":"MixerAdvancedEvent","guildId":"<id>","epoch":<n>,
       "encodedTrack":"<base64>","handoffType":"CROSSFADE"|"GAPLESS",
       "handoffId":"<uuid>"}`
      - The server has handed off playback to the next track. The client
        must synchronize its local queue without starting the same track again.
        handoffId is included only for CROSSFADE.
    - `{"op":"mixer","type":"MixerOverriddenEvent","guildId":"<id>","epoch":<n>,
       "requestId":"<idemKey>","action":"STOP"|"PLAY_NOW"}`
      - A user or admin stop/skip command has executed on the engine.
    - `{"op":"mixer","type":"overlapStart","guildId":"<id>","crossfadeMs":<ms>,
       "handoffInMs":<ms>,"incomingStartMs":<ms>,"beatMatched":<bool>,"fadeBeats":<n>,"targetBpm":<bpm>,"rateRatio":<ratio>,
       "fallbackReason":"...","track":{"identifier":"...","title":"..."}}`
      - an overlap (crossfade) armed; `track` is the incoming track.
    - `{"op":"mixer","type":"overlapEnd","guildId":"<id>","reason":"handoff"|"aborted",
       "beatMatched":<bool>,"fallbackReason":"...","detail":"<abort reason, when aborted>",
       "track":{"identifier":"...","title":"..."}}`
      - the overlap handed off, or was torn down (client replace/stop).
        A native failure after overlapStart can make overlapEnd report
        beatMatched=false and fallbackReason=timescale_native_failed.
    - `{"op":"mixer","type":"announceStart","guildId":"<id>","announcementId":<id>,
       "track":{"identifier":"...","title":"..."}}`
      - a queued announcement started. Parallel starts also include mode="parallel".
    - `{"op":"mixer","type":"announceEnd","guildId":"<id>"}`
      - the overlay ended (natural end, cancel, or sub failure).
        Parallel end events include announcementId; sequential ends omit it.
    WebSocket payload schemas are listed under components.schemas.MixerEvent.
    These are messages on the existing Lavalink socket, not HTTP webhook routes.
servers:
  - url: http://localhost:2333
    description: Lavalink server (same host/port/auth as the v4 API)
security:
  - lavalinkAuth: []
components:
  securitySchemes:
    lavalinkAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Raw server password (same as the Lavalink v4 API, no Bearer prefix)
  schemas:
    Error:
      type: object
      description: Explicit protocol error body. Framework-generated errors may use a different shape.
      required: [error]
      properties:
        error: { type: string }
    ConflictError:
      type: object
      required: [error, lastKnownEpoch]
      properties:
        error:
          type: string
          enum: [STALE_EPOCH, PRE_RESET_ARRIVAL]
        lastKnownEpoch:
          type: integer
          format: int64
          description: The newest epoch the server has accepted. Present for both conflict kinds.
        windowOpenAt:
          type: integer
          format: int64
          description: The exact timestamp when the post-reset grace window opens on the server. Only present for PRE_RESET_ARRIVAL errors.
    DuplicateResponse:
      type: object
      required: [duplicate]
      properties:
        duplicate: { type: boolean, const: true }
    ArmRequest:
      type: object
      required: [guildId, epoch]
      properties:
        guildId:
          type: string
          description: Guild snowflake as a string (JSON numbers lose precision past 2^53)
        epoch:
          type: integer
          format: int64
          description: Monotonic client epoch (must be >= server lastKnownEpoch)
        encodedTrack:
          type: [string, 'null']
          description: Exact Lavalink base64 track. Required when isEmpty is false; omit or use null for an empty slot. Supplied values are decoded even when isEmpty is true.
        isEmpty:
          type: boolean
          default: false
          description: Set true if the client has no next track (server enters NO_NEXT state)
        preserveTransition:
          type: boolean
          default: false
          description: Explicit intent to preserve this track boundary (for example continuous album playback). Disables overlap, boundary trimming and incoming fade-in for this arm. Included in the idempotency fingerprint; cleared by replacement arm/invalidate/reset.
        startPositionMs:
          type: integer
          format: int64
          minimum: 0
          description: Optional minimum start position of the incoming track in milliseconds. Omit for 0. Requires a non-empty track. A nonzero position requires a seekable track with more than 500ms remaining. Applied before overlap or gapless playback, including when preserveTransition is true. Included in the idempotency fingerprint.
        outgoingEndPositionMs:
          type: integer
          format: int64
          minimum: 501
          description: Optional effective end of the currently playing track in milliseconds, for example the start of a SponsorBlock outro. The mixer ends its fade and hands off by this point. Requires a non-empty next track, a seekable current track, and preserveTransition=false. The cutoff must be more than 500ms from both track boundaries. A cutoff already passed or within 500ms of the current position when armed is ignored safely. Included in the idempotency fingerprint.
    AnalyzeRequest:
      type: object
      required: [guildId, encodedTrack]
      properties:
        guildId: { type: string }
        encodedTrack: { type: string }
    ArmResponse:
      type: object
      required: [state, epoch]
      properties:
        state:
          type: string
          enum: [IDLE, PLAYING, ARMED, NO_NEXT]
        epoch: { type: integer, format: int64 }
    InvalidateRequest:
      type: object
      required: [guildId, epoch]
      properties:
        guildId: { type: string }
        epoch: { type: integer, format: int64 }
    InvalidateResponse:
      type: object
      required: [state, epoch, refiredNeedNext]
      properties:
        state:
          type: string
          enum: [IDLE, PLAYING, ARMED, NO_NEXT]
        epoch: { type: integer, format: int64 }
        refiredNeedNext:
          type: boolean
          description: True when a JIT refire was scheduled. Dispatch can be suppressed by deduplication or a superseding transition.
    OverrideRequest:
      type: object
      required: [guildId, epoch, action]
      properties:
        guildId: { type: string }
        epoch: { type: integer, format: int64 }
        action:
          type: string
          enum: [STOP, PLAY_NOW]
          description: STOP = clear queue and halt. PLAY_NOW = clear queue and play the supplied encodedTrack.
        encodedTrack:
          type: [string, 'null']
          description: Required if action is PLAY_NOW.
    OverrideResponse:
      type: object
      required: [state, epoch]
      properties:
        state:
          type: string
          enum: [IDLE, PLAYING, ARMED, NO_NEXT]
        epoch: { type: integer, format: int64 }
    ResetRequest:
      type: object
      required: [guildId, epoch]
      properties:
        guildId: { type: string }
        epoch: { type: integer, format: int64 }
        windowOpenGraceMs:
          type: integer
          format: int64
          default: 1500
          description: Grace window for new arm/invalidate/override keys. Values <= 0 disable it. Retained duplicate keys are checked before this window.
    ResetResponse:
      type: object
      required: [lastKnownEpoch, protocolVersion]
      properties:
        lastKnownEpoch: { type: integer, format: int64 }
        protocolVersion: { type: integer, const: 2 }
        duplicate: { type: boolean, const: true, description: "Present only for a retained duplicate reset." }
    TrackInfo:
      type: object
      properties:
        identifier: { type: string }
        title: { type: string }
        author: { type: string }
        duration: { type: integer, format: int64 }
        uri: { type: [string, 'null'] }
        isStream: { type: boolean }
        isSeekable: { type: boolean }
        source: { type: string }
    MixerState:
      type: object
      description: Current configuration and playback snapshot; not an analysis-completion acknowledgement.
      properties:
        protocolVersion: { type: integer, const: 2 }
        state:
          type: string
          enum: [IDLE, PLAYING, ARMED, NO_NEXT]
          description: Protocol state. ARMED does not mean analysis is complete.
        guildId: { type: string }
        hasNext: { type: boolean, description: "A preloaded next track is waiting (pending or ready)" }
        overlayActive: { type: boolean }
        crossfadeActive: { type: boolean }
        crossfadeEnabled: { type: boolean }
        crossfadeMs: { type: integer, format: int64 }
        fadeInMs: { type: integer, format: int64 }
        duckLevel: { type: number, format: float }
        normalizationEnabled: { type: boolean }
        silenceEnabled: { type: boolean }
        silenceThresholdDb: { type: number, format: float }
        tailConfirmMs: { type: integer, format: int64 }
        nextTrimMs:
          type: [array, 'null']
          description: "[leading silence ms, trailing silence ms]; null if no nonzero trim result is available."
          minItems: 2
          maxItems: 2
          prefixItems:
            - { type: integer, format: int64 }
            - { type: integer, format: int64 }
        nextTrackIdentifier: { type: [string, 'null'] }
        nextTrackTitle: { type: [string, 'null'] }
        analysisState:
          type: string
          enum: [idle, pending, analyzing, ready]
          description: Analysis activity and queue readiness. ready does not guarantee a BPM grid; analyzing can describe a baseline scan.
        subTrackIdentifier: { type: [string, 'null'] }
        mixerFilterActive: { type: boolean }
        crossfadeHandoffInMs: { type: [integer, 'null'], format: int64 }
        announcementsQueued: { type: integer }
        currentTrackGain: { type: number, format: float }
        currentTrackGainDb: { type: number, format: float }
        nextTrackGain: { type: [number, 'null'], format: float }
        nextTrackGainDb: { type: [number, 'null'], format: float }
        bpmDetectionEnabled: { type: boolean }
        adaptiveTransitionsSupported: { type: boolean, const: true }
        currentTrackBpm:
          type: [number, 'null']
          description: Cached original tempo of the current main track, not the temporarily stretched playback rate. Null when detection is disabled or no result exists.
        currentTrackBpmIdentifier:
          type: [string, 'null']
          description: Track identifier captured atomically with currentTrackBpm. Clients must compare it to their confirmed current track before displaying the value.
        transitionKind:
          type: string
          description: Most recently selected transition (none, preserve, silence_trim, short_crossfade, crossfade, beat_matched). The short_crossfade compatibility label denotes an equal-power fallback; its duration honors crossfadeMs, bounded by available outgoing content.
        decisionReason: { type: [string, 'null'] }
        nextTrackBpm:
          type: [number, 'null']
          format: float
          description: Detected tempo of the queued track; null when disabled, absent, pending, or no usable beat result was found.
        nextTrackPhaseMs:
          type: [integer, 'null']
          format: int64
          description: Track-relative beat-grid phase in milliseconds; not a musical downbeat.
        nextTrackBpmConfidence:
          type: [number, 'null']
          format: float
        beatmatchEnabled: { type: boolean }
        maxTempoChange: { type: number, format: float, minimum: 0, maximum: 0.12 }
        beatmatchMinConfidence: { type: number, format: float, minimum: 0, maximum: 1 }
        lastKnownEpoch:
          type: integer
          format: int64
          description: The latest accepted client epoch for this guild's state machine (0 if untouched).
    CrossfadeRequest:
      type: object
      required: [guildId, enabled]
      properties:
        guildId: { type: string }
        enabled: { type: boolean }
        durationMs: { type: [integer, 'null'], format: int64, description: "Clamped to [500, 30000] ms when supplied." }
    FadeInRequest:
      type: object
      required: [guildId, durationMs]
      properties:
        guildId: { type: string }
        durationMs: { type: integer, format: int64, description: "Clamped to [0, 10000] ms; zero disables fade-in." }
    AnnounceRequest:
      description: Provide a nonblank identifier or encodedTrack. Encoded track takes precedence; loading occurs when the queued item starts.
      type: object
      required: [guildId]
      properties:
        guildId: { type: string }
        identifier: { type: [string, 'null'] }
        encodedTrack: { type: [string, 'null'] }
        duckLevel: { type: [number, 'null'], format: float }
        mode:
          type: [string, 'null']
          examples: [sequential, parallel]
          description: Case-insensitive; omitted, null, or empty uses sequential. Other values return 400.
          default: sequential
        channel:
          type: [string, 'null']
          enum: [both, left, right]
          examples: [both, left, right]
          description: "Target stereo channel for the announcement. Case-insensitive ('left'/'l', 'right'/'r', or 'both'/null). If omitted, plays on both channels."
          default: both
    AnnounceQueuedResponse:
      type: object
      required: [guildId, id, position, queueLength]
      properties:
        guildId: { type: string }
        id: { type: integer, format: int64 }
        position: { type: integer, minimum: 1, description: "Queue position at enqueue time." }
        queueLength: { type: integer }
    AnnounceCancelRequest:
      type: object
      required: [guildId]
      properties:
        guildId: { type: string }
    SilenceRequest:
      type: object
      required: [guildId, enabled]
      properties:
        guildId: { type: string }
        enabled: { type: boolean }
        thresholdDb: { type: [number, 'null'], format: float, description: "Clamped to [-90, -20] dB when supplied." }
        minSoundMs: { type: [integer, 'null'], format: int64, description: "Clamped to [20, 2000] ms when supplied." }
        headScanMs: { type: [integer, 'null'], format: int64, description: "Clamped to [1000, 60000] ms when supplied." }
        tailScanMs: { type: [integer, 'null'], format: int64, description: "Clamped to [1000, 60000] ms when supplied." }
        tailConfirmMs: { type: [integer, 'null'], format: int64, description: "Clamped to [300, 10000] ms when supplied." }
    NormalizationRequest:
      type: object
      required: [guildId, enabled]
      properties:
        guildId: { type: string }
        enabled: { type: boolean }
        targetLufs:
          type: [number, 'null']
          format: float
          description: Target loudness in LUFS (default -14.0). Clamped to [-30.0, -6.0].
    BpmRequest:
      type: object
      required: [guildId, enabled]
      properties:
        guildId: { type: string }
        enabled:
          type: boolean
          description: Enable BPM analysis. Defaults to false for a new mixer.
        scanMs:
          type: [integer, 'null']
          format: int64
          description: Head and tail window length for tempo analysis (default 30000). Clamped to [5000, 60000].
        beatmatchEnabled:
          type: [boolean, 'null']
          description: Optional beat-matching toggle. Omission preserves the current setting. Crossfade must also be enabled.
        maxTempoChange:
          type: [number, 'null']
          format: float
          description: Maximum absolute deviation of the tempo ratio from 1.0. Default 0.06, clamped to [0, 0.12].
        minConfidence:
          type: [number, 'null']
          format: float
          description: Minimum confidence required for both beat grids. Default 0.30, clamped to [0, 1].
    BeatmatchRequest:
      type: object
      required: [guildId, enabled]
      properties:
        guildId: { type: string }
        enabled:
          type: boolean
          description: Enable beat matching. Defaults to false for a new mixer. Does not change BPM detection or crossfade settings.
        maxTempoChange:
          type: [number, 'null']
          format: float
          description: Maximum absolute deviation of the tempo ratio from 1.0. Default 0.06, clamped to [0, 0.12].
        minConfidence:
          type: [number, 'null']
          format: float
          description: Minimum confidence required for both beat grids. Default 0.30, clamped to [0, 1].
    EventTrack:
      type: object
      required: [identifier, title]
      properties:
        identifier: { type: [string, 'null'] }
        title: { type: string }
    MixerEventBase:
      type: object
      required: [op, type, guildId]
      properties:
        op: { type: string, const: mixer }
        type: { type: string }
        guildId: { type: string }
        transitionKind:
          type: string
          description: Selected transition kind on overlap and advance events.
        decisionReason:
          type: string
          description: Optional diagnostic reason on overlap and advance events; not a closed enum.
    BeatmatchFallbackReason:
      type: string
      description: |
        Diagnostic string, not a closed enum. Missing analysis never blocks playback.
        A native failure after overlapStart can change the outcome reported by overlapEnd.
      examples:
        - beatmatch_disabled
        - bpm_disabled
        - missing_incoming_track
        - incoming_unseekable
        - missing_outgoing_grid
        - missing_incoming_grid
        - invalid_bpm
        - low_confidence
        - tempo_diff_exceeded
        - fade_window_too_short
        - incoming_track_too_short
        - incoming_start_outside_analysis
        - policy_error
        - timescale_native_failed
    MixerNeedNextTrackEvent:
      allOf:
        - { $ref: '#/components/schemas/MixerEventBase' }
        - type: object
          required: [remainingMs, currentTrackEncoded]
          properties:
            type: { const: MixerNeedNextTrackEvent }
            remainingMs: { type: integer, format: int64 }
            currentTrackEncoded:
              type: string
              description: Canonical position-zero encoded track when encoding succeeds; track identifier if encoding fails.
    MixerAdvancedEvent:
      allOf:
        - { $ref: '#/components/schemas/MixerEventBase' }
        - type: object
          required: [epoch, encodedTrack, handoffType]
          properties:
            type: { const: MixerAdvancedEvent }
            epoch: { type: integer, format: int64 }
            encodedTrack:
              type: string
              description: Accepted encoded track when retained, otherwise re-encoded with an identifier fallback on failure.
            handoffType: { type: string, enum: [CROSSFADE, GAPLESS] }
            handoffId:
              type: string
              format: uuid
              description: Present for a crossfade when the armed handoff ID is available; omitted for gapless.
    MixerOverriddenEvent:
      allOf:
        - { $ref: '#/components/schemas/MixerEventBase' }
        - type: object
          required: [epoch, requestId, action]
          properties:
            type: { const: MixerOverriddenEvent }
            epoch: { type: integer, format: int64 }
            requestId: { type: string, description: "Accepted Idempotency-Key." }
            action: { type: string, enum: [STOP, PLAY_NOW] }
    OverlapStartEvent:
      allOf:
        - { $ref: '#/components/schemas/MixerEventBase' }
        - type: object
          required: [crossfadeMs, handoffInMs, incomingStartMs, beatMatched, track]
          properties:
            type: { const: overlapStart }
            crossfadeMs: { type: integer, format: int64 }
            handoffInMs: { type: integer, format: int64, minimum: 0 }
            incomingStartMs: { type: integer, format: int64, minimum: 0, description: Actual secondary track position before overlap prefill. }
            overlapMs: { type: integer, format: int64, description: Duration of the two-track gain fade. }
            recoveryMs: { type: integer, format: int64, description: Incoming-only tempo recovery after the outgoing gain reaches zero. }
            beatMatched: { type: boolean }
            fadeBeats: { type: integer, enum: [2, 4, 8], description: "Present when beatMatched is true." }
            targetBpm: { type: number, description: "Outgoing tempo; present when beatMatched is true." }
            rateRatio:
              type: number
              description: Outgoing BPM divided by incoming BPM; present when beatMatched is true. Held during overlap, then reset on handoff.
            fallbackReason: { $ref: '#/components/schemas/BeatmatchFallbackReason' }
            track: { $ref: '#/components/schemas/EventTrack' }
    OverlapEndEvent:
      allOf:
        - { $ref: '#/components/schemas/MixerEventBase' }
        - type: object
          required: [reason, beatMatched]
          properties:
            type: { const: overlapEnd }
            reason: { type: string, enum: [handoff, aborted] }
            beatMatched: { type: boolean }
            detail: { type: string, description: "Present for an aborted overlap." }
            fallbackReason: { $ref: '#/components/schemas/BeatmatchFallbackReason' }
            track: { $ref: '#/components/schemas/EventTrack' }
    AnnounceStartEvent:
      allOf:
        - { $ref: '#/components/schemas/MixerEventBase' }
        - type: object
          required: [track]
          properties:
            type: { const: announceStart }
            announcementId: { type: integer, format: int64 }
            mode: { type: string, const: parallel, description: "Present only for parallel announcements." }
            track: { $ref: '#/components/schemas/EventTrack' }
    AnnounceEndEvent:
      allOf:
        - { $ref: '#/components/schemas/MixerEventBase' }
        - type: object
          properties:
            type: { const: announceEnd }
            announcementId: { type: integer, format: int64, description: "Present for parallel announcements." }
    MixerEvent:
      description: Custom messages on the existing Lavalink WebSocket connection.
      oneOf:
        - { $ref: '#/components/schemas/MixerNeedNextTrackEvent' }
        - { $ref: '#/components/schemas/MixerAdvancedEvent' }
        - { $ref: '#/components/schemas/MixerOverriddenEvent' }
        - { $ref: '#/components/schemas/OverlapStartEvent' }
        - { $ref: '#/components/schemas/OverlapEndEvent' }
        - { $ref: '#/components/schemas/AnnounceStartEvent' }
        - { $ref: '#/components/schemas/AnnounceEndEvent' }
paths:
  /mixer/info:
    get:
      operationId: getInfo
      summary: Returns protocol version and plugin version
      responses:
        '200':
          description: Info
          content:
            application/json:
              schema:
                type: object
                properties:
                  protocolVersion: { type: integer, const: 2 }
                  incomingStartPositionSupported: { type: boolean, const: true }
                  outgoingEndPositionSupported: { type: boolean, const: true }
                  version:
                    type: string
                    description: Resolved from the packaged plugin descriptor (Gradle build version), matching the running JAR.
                    examples: ['0.3.6']
  /mixer/queue/arm:
    post:
      operationId: arm
      summary: Arm the next track atomically (JIT Prefetch)
      description: |
        The core v2 transition. The client calls this in response to
        `MixerNeedNextTrackEvent`, or after a queue mutation, with the exact
        expected `epoch` and an `Idempotency-Key`. Transitions the mixer state
        to `ARMED` (with track; analysis may still be pending) or `NO_NEXT` (if empty). The same
        `Idempotency-Key` replayed with a different payload is rejected. An optional
        `startPositionMs` starts the incoming track after its skipped intro in
        both overlap and gapless paths; invalid positions are rejected before
        recording the idempotency key. `outgoingEndPositionMs` treats the start
        of an outgoing outro as the effective track end, including the fade
        handoff. It is ignored if the cutoff has already passed when armed.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, description: "Stable key for retries of this logical command; UUID format is not enforced." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArmRequest' }
      responses:
        '200':
          description: Track armed or accepted as no-next
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ArmResponse' }
                  - { $ref: '#/components/schemas/DuplicateResponse' }
        '400': { description: "Bad request, missing Idempotency-Key, etc." }
        '409':
          description: Epoch mismatch or arrival too early post-reset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConflictError' }
        '422':
          description: Same Idempotency-Key replayed with different payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /mixer/queue/invalidate:
    post:
      operationId: invalidate
      summary: Drop the armed next track and re-evaluate JIT
      description: |
        Called when the user or system altered the queue head mid-play (e.g.
        skip, shuffle, remove). Clears the ARMED slot. If the current track
        is already inside the handoff window, the server will re-fire
        `MixerNeedNextTrackEvent` to get a fresh arm.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvalidateRequest' }
      responses:
        '200':
          description: Slot invalidated
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/InvalidateResponse' }
                  - { $ref: '#/components/schemas/DuplicateResponse' }
        '409':
          description: Stale epoch or pre-reset arrival
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConflictError' }
        '400': { description: "Missing header or invalid request." }
        '422':
          description: Retained request key has a different fingerprint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /mixer/queue/override:
    post:
      operationId: override
      summary: Force a state change on the audio engine (Stop or Play-now)
      description: |
        Clears the ARMED slot and schedules the player mutation on the ordered
        action executor. STOP sets protocol state to IDLE; PLAY_NOW sets PLAYING.
        HTTP 200 acknowledges acceptance, not completed player mutation.
        MixerOverriddenEvent reports execution. A superseded action can be skipped.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverrideRequest' }
      responses:
        '200':
          description: Command accepted, or retained duplicate
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/OverrideResponse' }
                  - { $ref: '#/components/schemas/DuplicateResponse' }
        '400': { description: "Bad request, invalid action or missing track" }
        '409':
          description: Stale epoch or pre-reset arrival
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConflictError' }
        '422':
          description: Retained request key has a different fingerprint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /mixer/reset:
    post:
      operationId: reset
      summary: Synchronize the epoch baseline (bot boot/resume hook)
      description: |
        Called by the client when it starts up or resumes a session, to
        resynchronize state. Clears prior request fingerprints, retains the reset
        key, and sets the epoch to max(current, supplied). A positive grace sets
        windowOpenAt to now + windowOpenGraceMs. Clears the next-track slot and
        aborts an active overlap; current main playback is retained.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetRequest' }
      responses:
        '200':
          description: Server reset complete
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResetResponse' }
        '400': { description: "Missing header or invalid request." }
        '422':
          description: Retained request key has a different fingerprint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /mixer/analyze:
    post:
      operationId: preanalyze
      summary: Warm enabled silence, BPM, and adaptive feature caches without arming playback
      description: |
        Optional best-effort warmup before the normal JIT arm. Requires silence
        skipping or BPM detection and a seekable, known-length track. Normalization
        analysis remains on the normal arming path. One active or queued scan and the latest
        deferred warmup are retained per guild. Busy scans accept the latest
        warmup request; disabled, already cached or unsupported tracks return accepted=false.
        A 202 receipt does not mean analysis succeeded. Normal JIT analysis remains
        the fallback. No epoch or Idempotency-Key is required: results are track-keyed
        cache metadata and never create or replace an armed slot.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyzeRequest' }
      responses:
        '202':
          description: Warmup receipt
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: boolean }
        '400': { description: Invalid guild ID or encoded track }

  /mixer/state:
    get:
      operationId: getState
      summary: Mixer state and per-guild config
      parameters:
        - name: guildId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MixerState' }
        '400': { description: "Invalid guild ID or request parameters; error body is provided by the host framework." }

  /mixer/crossfade:
    post:
      operationId: setCrossfade
      summary: Configure overlap crossfade
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrossfadeRequest' }
      responses:
        '200':
          description: Updated state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MixerState' }
        '400': { description: "Invalid guild ID or request parameters; error body is provided by the host framework." }

  /mixer/fade-in:
    post:
      operationId: setFadeIn
      summary: Configure fade-in on track start
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FadeInRequest' }
      responses:
        '200':
          description: Updated state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MixerState' }
        '400': { description: "Invalid guild ID or request parameters; error body is provided by the host framework." }

  /mixer/announce:
    post:
      operationId: announce
      summary: Queue an audio overlay over the music with ducking (TTS use-case)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnounceRequest' }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnounceQueuedResponse' }
        '400': { description: "Invalid guild ID or request parameters; error body is provided by the host framework." }

  /mixer/announce/queue:
    delete:
      operationId: clearAnnounceQueue
      summary: Drop all queued (not active) announcements
      parameters:
        - name: guildId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cleared count
          content:
            application/json:
              schema:
                type: object
                properties:
                  cleared: { type: integer }
        '404': { description: "No mixer exists for this guild." }
        '400': { description: "Invalid guild ID or request parameters; error body is provided by the host framework." }

  /mixer/announce/cancel:
    post:
      operationId: cancelAnnounce
      summary: Stop the active sequential announcement
      description: |
        Stops the sequential overlay only. Parallel overlays and waiting
        announcements are unchanged. Music ducking remains while a parallel
        overlay is still active.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnounceCancelRequest' }
      responses:
        '204': { description: "Sequential overlay stopped" }
        '404': { description: "No active sequential overlay" }
        '400': { description: "Invalid guild ID or request parameters; error body is provided by the host framework." }

  /mixer/normalization:
    post:
      operationId: setNormalization
      summary: Configure EBU R128 volume normalization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NormalizationRequest' }
      responses:
        '200':
          description: Updated state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MixerState' }
        '400': { description: "Invalid guild ID or request parameters; error body is provided by the host framework." }

  /mixer/silence:
    post:
      summary: Configure leading/trailing silence skipping
      description: |
        Silence skipping defaults to disabled. Enable it with `enabled: true`;
        seekable queued and currently playing tracks are analyzed off the live
        audio path. If analysis is unavailable, realtime PCM detection waits for
        confirmed silence in the configured tail window before advancing. The
        default threshold is -60 dB and tail confirmation is 1000 ms.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SilenceRequest' }
      responses:
        '200':
          description: Updated state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MixerState' }
        '400': { description: "Invalid guild ID or request parameters; error body is provided by the host framework." }

  /mixer/bpm:
    post:
      operationId: setBpmDetection
      summary: Configure tempo (BPM) detection for preloaded tracks
      description: |
        Enable before arming tracks to allow time for analysis. Set enabled and
        beatmatchEnabled to true to enable analysis and beat matching together.
        Crossfade must also be enabled. This endpoint does not require an
        Idempotency-Key. Configuration success does not mean beat grids are ready.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BpmRequest' }
            example:
              guildId: '123456789012345678'
              enabled: true
              beatmatchEnabled: true
              scanMs: 30000
              maxTempoChange: 0.06
              minConfidence: 0.30
      responses:
        '200':
          description: Updated state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MixerState' }
        '400': { description: "Invalid guild ID or request parameters; error body is provided by the host framework." }

  /mixer/beatmatch:
    post:
      operationId: setBeatmatch
      summary: Configure beat-matched automix
      description: |
        Changes beat-matching settings without changing BPM detection or crossfade.
        Both must be enabled separately. This endpoint does not require an
        Idempotency-Key. Missing grids, low confidence, or incompatible tempos
        use ordinary equal-power crossfade when available. Missing or unknown
        analysis features retain the configured crossfade duration, bounded by
        available outgoing content; they do not impose a fixed 1.5-second cap.
        Overlap events report
        beatMatched and fallbackReason, including bpm_disabled when analysis is off.
        If crossfade cannot be planned, the existing non-overlap advance path remains.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeatmatchRequest' }
      responses:
        '200':
          description: Updated state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MixerState' }
        '400': { description: "Invalid guild ID or request parameters; error body is provided by the host framework." }
